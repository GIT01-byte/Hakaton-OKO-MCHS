services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oko
      POSTGRES_PASSWORD: oko
      POSTGRES_DB: oko
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oko -d oko"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://oko:oko@db:5432/oko
      MEDIA_DIR: /app/media
      BASE_LAT: "56.8389"
      BASE_LON: "60.6057"
    volumes:
      - ./media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
